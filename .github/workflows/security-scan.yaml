name: Scan published image

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: published-image-security-scan
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Audit deployed lockfiles
        run: sh scripts/security-audit.sh
      - name: Log in
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke-test published container
        run: sh scripts/container-smoke-test.sh ghcr.io/${{ github.repository }}:main
      - name: Scan published image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:main
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          version: v0.74.0
