name: Scan published image

on:
  schedule:
    - cron: "17 7 * * 0"
  workflow_dispatch:

concurrency:
  group: published-image-security-scan
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve deployed digest and source revision once
        id: resolve
        run: python3 -m scripts.resolve_published_image "ghcr.io/${GITHUB_REPOSITORY,,}"

  dependency-gate:
    needs: deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.deployment.outputs.revision }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: sh scripts/security-audit.sh gate

  dependency-report:
    needs: deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.deployment.outputs.revision }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Report all dependency findings
        id: report
        continue-on-error: true
        run: sh scripts/security-audit.sh report
      - name: Summarize report outcome
        if: steps.report.outcome == 'failure'
        run: echo 'The complete dependency report found advisories or could not finish. See audit logs; the independent dependency and image gates remain blocking.' >> "$GITHUB_STEP_SUMMARY"

  image-security:
    needs: deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_IMAGE: ${{ needs.deployment.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ env.SOURCE_IMAGE }}
          output: ${{ runner.temp }}/security-reports/image.json
      - name: Enforce production vulnerability policy
        run: python3 scripts/compare_image_vulnerabilities.py "$RUNNER_TEMP/security-reports/image.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Retain scan evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: image-security-report
          path: ${{ runner.temp }}/security-reports/*.json
          retention-days: 14
          if-no-files-found: warn
