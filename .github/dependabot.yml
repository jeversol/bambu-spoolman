version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: personal
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Indiana/Indianapolis
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    target-branch: personal
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Indiana/Indianapolis
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    target-branch: personal
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Indiana/Indianapolis
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: personal
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/Indiana/Indianapolis
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5
