[project]
name = "bambu-spoolman"
version = "0.1.0"
description = "Synchronize Bambu Lab printer filament usage with Spoolman"
authors = [
    { name = "mrkirby153", email = "mr.austinwhyte@gmail.com" },
    { name = "Joe Eversole", email = "joe@recompiled.org" },
]
requires-python = "~=3.14.0"
readme = "README.md"
dependencies = [
    "aiohttp>=3.14.5,<4",
    "loguru>=0.7.3,<0.8",
    "requests>=2.34.2,<3",
    "python-dotenv>=1.2.2,<2",
    "paho-mqtt>=2.1.0,<3",
]

[project.scripts]
bambu-spoolman-broker = "bambu_spoolman.daemon:main"
mqtt-replay = "bambu_spoolman.debug.replay:main"

[dependency-groups]
dev = [
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["E", "F", "I"]
